name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # remove cache: 'npm' if you suspect corrupted action cache
          # cache: 'npm'

      - name: Verify npm cache
        run: |
          npm cache verify || npm cache clean --force || true

      - name: Install dependencies (with retry)
        run: |
          set -e
          max_attempts=3
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: npm ci"
            if npm ci; then
              echo "npm ci succeeded"
              break
            fi
            echo "npm ci failed — cleaning npm cache and retrying..."
            npm cache clean --force || true
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
            if [ $attempt -gt $max_attempts ]; then
              echo "All attempts failed."
              exit 1
            fi
          done
